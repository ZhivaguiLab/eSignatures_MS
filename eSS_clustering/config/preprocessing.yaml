# Preprocessing Configuration
# Removes samples before clustering: by name (exclude) and, optionally, by
# total mutation count per species (min_mutations)

# Exclusion patterns by mutation type
# Samples matching ANY pattern will be excluded

DBS:
  exclude:
    - hTumor          # Remove anything containing 'hTumour'
    # Add more DBS-specific patterns here

ID:
  exclude:
    - hTumor          # Remove anything containing 'hTumour'
    # Add more ID-specific patterns here

SBS:
  exclude:
    # Study decision: these mouse MEF exposures are not part of the eSignature
    # atlas (removes 10 MEF samples: Xenon, Xenon XPA-/-, Deoxynivalenol,
    # Deoxynivalenol + Patulin). Previously hard-coded in
    # pipeline/utils/mutation_type.py.
    - Xenon
    - Deoxynivalenol
  # Minimum total SBS count: samples below it are removed. 307 is the
  # Poisson-resampling stability threshold (the "SBS for 99% of simulations"
  # value over all species), applied to every species. Every sample is
  # tested, whatever its name; every species in data/input/SBS must be listed.
  # To try other cutoffs (e.g. the per-species "SBS for 99% of simulations"
  # values: mouse 235, human 295, celegans 451, chicken 300, rat 6354), edit
  # the numbers below; the next run rebuilds the preprocessed data.
  min_mutations:
    mouse:    307
    human:    307
    celegans: 307
    chicken:  307
    rat:      307

# Pattern matching is case-insensitive by default
# 'hTumour', 'htumour', 'HTUMOUR' all match
case_sensitive: false

# Notes:
# - Patterns are matched as substrings
# - min_mutations keeps samples with total >= the cutoff for their species
#   (species is detected from the file name)
# - For SBS, preprocessing also writes the normalized profiles (each sample's
#   counts divided by its total)
# - Removed samples are listed in data/input_cleaned/<TYPE>/preprocessing_removed_samples.csv
# - If neither exclude nor min_mutations is defined for a type, no preprocessing occurs
# - Cleaned data is cached in data/input_cleaned/<TYPE>/ for reuse
# - The cache is rebuilt automatically when the input files or settings change;
#   use --force_preprocess to rebuild it anyway
